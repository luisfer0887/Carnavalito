<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Carnavalito</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="video-width-fix.css">
  <link rel="stylesheet" href="editorial.css"><!-- NUEVO: estilos sección editorial -->
</head>
<body>
  <div id="svgStage" class="svg-stage" aria-label="Infografía Carnavalito interactiva">
    <img id="mainSvg" src="assets/carnavalito.svg" alt="Infografía Carnavalito" draggable="false" loading="eager" decoding="async">
    <div id="ambientEffects" class="ambient-effects" aria-hidden="true"></div>
    <div id="graphEffects" class="graph-effects" aria-hidden="true"></div>
    <div id="textBoxEffects" class="text-box-effects" aria-hidden="true"></div>
    <div id="videoLayer" class="video-layer" aria-label="Video interactivo"></div>
    <div id="videoForegroundLayer" class="video-foreground-layer" aria-hidden="true"></div>
    <div id="mapInteractionLayer" class="map-interaction-layer" aria-label="Mapa de propuestas inscritas"></div>
    <div id="timelineInteractionLayer" class="timeline-interaction-layer" aria-label="Línea de tiempo interactiva"></div>
    <div id="hotspots" class="hotspots" aria-label="Puntos de información"></div>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       SECCIÓN EDITORIAL — nueva, va después de la infografía
       principal. No modifica nada de lo que había antes.

       Para agregar los videos de YouTube, reemplaza el src=""
       de cada iframe con la URL de embed de YouTube:
         https://www.youtube.com/embed/TU_VIDEO_ID
       ═══════════════════════════════════════════════════════════ -->
  <section id="editorialStage" class="editorial-stage" aria-label="Editorial Carnavalito">
    <div class="editorial-wrapper">
      <img class="editorial-img"
           src="assets/editorial.svg"
           alt="Editorial Carnavalito"
           draggable="false"
           loading="lazy"
           decoding="async">

      <!-- VIDEO 1 — César Villota
           Cambia src="" por: https://www.youtube.com/embed/ID_DEL_VIDEO -->
      <div class="editorial-video-slot" id="editorialVideo1">
        <iframe class="editorial-iframe"
                src="https://www.youtube.com/embed/xnYgQ_868JM"
                title="Video César Villota"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                loading="lazy"></iframe>
      </div>

      <!-- VIDEO 2 — Mariana Montaño
           Cambia src="" por: https://www.youtube.com/embed/ID_DEL_VIDEO -->
      <div class="editorial-video-slot" id="editorialVideo2">
        <iframe class="editorial-iframe"
                src="https://www.youtube.com/embed/jkhZkBw5deE"
                title="Video Mariana Montaño"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                loading="lazy"></iframe>
      </div>

      <!-- VIDEO 3 — Óscar Fernando Ruano
           Cambia src="" por: https://www.youtube.com/embed/ID_DEL_VIDEO -->
      <div class="editorial-video-slot" id="editorialVideo3">
        <iframe class="editorial-iframe"
                src="https://www.youtube.com/embed/nugoSIazssI?t=8s"
                title="Video Óscar Fernando Ruano"
                frameborder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                allowfullscreen
                loading="lazy"></iframe>
      </div>
    </div>
  </section>
  <!-- ═══════════════════════════════════════════ fin sección editorial -->

  <div id="proposalMobileSheet" class="proposal-mobile-sheet" aria-live="polite" aria-hidden="true"></div>

  <button id="backToTop" class="back-to-top" type="button" aria-label="Volver al inicio">↑</button>

  <div id="sourceModal" class="source-modal" aria-hidden="true">
    <div class="source-backdrop" data-close-modal></div>
    <section class="source-card" role="dialog" aria-modal="true" aria-describedby="sourceText">
      <button class="source-close" type="button" aria-label="Cerrar" data-close-modal>×</button>
      <div id="sourceContent" class="source-content"><p id="sourceText"></p></div>
    </section>
  </div>

  <script src="script.js" defer></script>
  <script src="video-width-fix.js" defer></script>
</body>
</html>
